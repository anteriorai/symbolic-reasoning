[project]
name = "jev-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "symbolic-reasoning",
    "typesafe-sdk>=0.7.0",
]


[tool.uv.sources]
symbolic-reasoning = { path = "../../../", editable = true }

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent"]
